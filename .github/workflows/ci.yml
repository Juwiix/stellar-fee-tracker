name: CI

# Least privilege: every job in this workflow only reads the repository.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same branch on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: check — fast-fail on formatting errors and clippy warnings.
  # Runs first; if it fails the more expensive test/build jobs are skipped.
  # ---------------------------------------------------------------------------
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Lightweight cache just for the registry index — no target/ needed here.
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          STELLAR_NETWORK: testnet
          POLL_INTERVAL_SECONDS: "60"
          DATABASE_URL: "sqlite::memory:"

  # ---------------------------------------------------------------------------
  # Job 2: test — run the full test suite including integration tests.
  # ---------------------------------------------------------------------------
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: check
    env:
      STELLAR_NETWORK: testnet
      POLL_INTERVAL_SECONDS: "60"
      DATABASE_URL: "sqlite::memory:"
      RUST_LOG: error
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Install SQLite system library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Run all tests
        run: cargo test --all

  # ---------------------------------------------------------------------------
  # Job 3: build — verify the release binary compiles cleanly.
  # Runs in parallel with test; both depend on check passing first.
  # ---------------------------------------------------------------------------
  build:
    name: Release Build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Install SQLite system library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build release binary
        run: cargo build --release
        env:
          STELLAR_NETWORK: testnet
          POLL_INTERVAL_SECONDS: "60"
          DATABASE_URL: "sqlite::memory:"

  # ---------------------------------------------------------------------------
  # Job 4: changes — reports whether packages/ui was touched. GitHub Actions
  # has no job-level `paths` filter, so the UI job below is gated on this.
  # ---------------------------------------------------------------------------
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect UI changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          # An empty or all-zero base means a new branch or the first push to
          # it: treat that as a change and run the UI job.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "$GITHUB_SHA" | grep -q '^packages/ui/'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Job 5: ui — lint, typecheck and build the Next.js dashboard. Runs only
  # when packages/ui changed, in parallel with the Rust jobs.
  # ---------------------------------------------------------------------------
  ui:
    name: UI Lint, Typecheck & Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
