name: Devkit Benchmarks

# Least privilege: every job in this workflow only reads the repository.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths: ['packages/devkit/**']

jobs:
  benchmark:
    name: Criterion Benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/devkit
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Mirrors rust-toolchain.toml (#984).
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/devkit
      - name: Compile benchmarks
        run: cargo bench --no-run
      - name: Run benchmarks (quick)
        # `shell: bash` implies `-o pipefail`, so a failing `cargo bench` fails
        # this step instead of being swallowed by the pipe into `tee`.
        shell: bash
        run: cargo bench -- --output-format bencher 2>&1 | tee benchmark-output.txt
      - name: Post results to step summary
        if: always()
        run: |
          echo "## Devkit Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat benchmark-output.txt >> $GITHUB_STEP_SUMMARY || echo "No output captured." >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
