[package]
name = "stellar-devkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Developer toolkit for testing and simulating the Stellar fee tracker"

[[bin]]
name = "stellar-devkit"
path = "src/main.rs"

[lib]
name = "stellar_devkit"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
once_cell = "1"
reqwest = "0.11"
rusqlite = "0.31"
thiserror = "1"

# CLI
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
proptest = "1"
wiremock = "0.5"
criterion = "0.5"

[[bench]]
name = "analytics_pipeline"
harness = false

[[bench]]
name = "percentile_table"
harness = false

[[bench]]
name = "rolling_window"
harness = false

[[bench]]
name = "spike_classifier"
harness = false
